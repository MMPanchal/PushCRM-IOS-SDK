name: PushCRMExample
options:
  bundleIdPrefix: com.pushcrm
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  PushCRM:
    path: ../

targets:
  PushCRMExample:
    type: application
    platform: iOS
    sources:
      - path: PushCRMExample
        excludes:
          - "**/.DS_Store"
    info:
      path: PushCRMExample/App/Resources/Info.plist
      properties:
        CFBundleDisplayName: PushCRM Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushcrm.example
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: PushCRMExample/App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: PushCRM
